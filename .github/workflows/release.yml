name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install dependencies with mise
        run: mise exec -- npm ci
      - name: Build and typecheck
        run: mise exec -- npm run build
      - name: Test composition and export arguments
        run: mise exec -- npm test
      - name: Package native application
        run: mise exec -- npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged app, import and exports
        run: mise exec -- npm run test:release
      - name: Verify precision editing and timeline
        run: mise exec -- node tests/editor12.cjs --packaged
      - name: Verify cursor layers and native helpers
        run: mise exec -- node tests/cursor.cjs --packaged
      - name: Verify seeking, fullscreen and tray
        run: mise exec -- node tests/editor14.cjs --packaged
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutter-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/Cutter-*.exe
            release/Cutter-*.dmg
            release/Cutter-*.zip
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .local-test/release-profile/*.png
            .local-test/editor12/*.png
            .local-test/cursor-test/*.png
            .local-test/editor14/*.png
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cutter-*
          merge-multiple: true
          path: downloads
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd downloads
          sha256sum Cutter-* > SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" downloads/* --verify-tag --title "Cutter ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
